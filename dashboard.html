<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sartisfação TCG - Progressão</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Barra de rolagem colada na extrema direita e com design Premium */
        .custom-scrollbar::-webkit-scrollbar { height: 14px; width: 14px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #0f172a; } /* Fundo igual à página */
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 8px; border: 3px solid #0f172a; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<!-- O body agora não tem margens e corta qualquer scroll externo (h-screen overflow-hidden) -->
<body class="bg-slate-900 text-white font-sans flex flex-col h-screen overflow-hidden">
    
    <!-- CABEÇALHO 100% FIXO -->
    <header class="w-full flex flex-col items-center pt-8 pb-4 shrink-0 bg-slate-900 z-50 border-b border-slate-800 shadow-xl">
        <div class="text-center mb-5">
            <h1 class="text-4xl font-extrabold text-yellow-400 mb-1 drop-shadow-md">Sartisfação TCG - Progressão</h1>
            <p class="text-slate-400 font-medium">Centro de Comando do Multiverso</p>
        </div>

        <!-- SISTEMA DE ABAS -->
        <div class="flex justify-center space-x-4 mb-2">
            <button id="aba-pokemon" onclick="mudarAba('pokemon')" class="px-6 py-2 bg-blue-600 text-white font-bold rounded-lg border-2 border-blue-400 shadow-lg shadow-blue-500/50 transition transform hover:scale-105">
                Pokémon TCG
            </button>
            <button id="aba-onepiece" onclick="mudarAba('onepiece')" class="px-6 py-2 bg-slate-800 text-slate-400 font-bold rounded-lg border-2 border-slate-700 hover:bg-red-900 hover:text-white hover:border-red-500 transition transform hover:scale-105">
                One Piece TCG
            </button>
        </div>

        <!-- Status de Carregamento -->
        <div id="loading" class="text-lg font-bold text-yellow-500 animate-pulse mt-4">
            A sincronizar com o Multiverso... aguarde.
        </div>
    </header>

    <!-- ÁREA DA TABELA (Com o Scroll na extrema direita) -->
    <!-- O flex-1 obriga esta área a preencher o resto do ecrã para baixo -->
    <main class="w-full flex-1 overflow-auto custom-scrollbar bg-slate-900 hidden" id="container-tabela">
        <!-- Padding interno apenas para a tabela respirar, mas não afeta a barra de rolagem -->
        <div class="p-6 md:p-8 w-full min-w-max">
            <table class="w-full text-sm text-left whitespace-nowrap bg-slate-800 shadow-2xl rounded-xl border border-slate-700" id="tabela-dashboard">
                <!-- Cabeçalho da Tabela Congelado (sticky top-0) -->
                <thead class="sticky top-0 z-40 bg-slate-950 text-slate-300 font-bold uppercase tracking-wider text-xs shadow-md border-b border-slate-700" id="tabela-head">
                    <!-- Injetado pelo JavaScript -->
                </thead>
                <tbody class="divide-y divide-slate-700" id="tabela-body">
                    <!-- Injetado pelo JavaScript -->
                </tbody>
            </table>
        </div>
    </main>

    <script>
        let dadosGlobais = null;
        let tcgAtual = 'pokemon'; 

        function mudarAba(tcg) {
            tcgAtual = tcg;
            const abaPkm = document.getElementById('aba-pokemon');
            const abaOP = document.getElementById('aba-onepiece');
            
            if (tcg === 'pokemon') {
                abaPkm.className = "px-6 py-2 bg-blue-600 text-white font-bold rounded-lg border-2 border-blue-400 shadow-lg shadow-blue-500/50 transition transform hover:scale-105";
                abaOP.className = "px-6 py-2 bg-slate-800 text-slate-400 font-bold rounded-lg border-2 border-slate-700 hover:bg-red-900 hover:text-white hover:border-red-500 transition transform hover:scale-105";
            } else {
                abaOP.className = "px-6 py-2 bg-red-600 text-white font-bold rounded-lg border-2 border-red-400 shadow-lg shadow-red-500/50 transition transform hover:scale-105";
                abaPkm.className = "px-6 py-2 bg-slate-800 text-slate-400 font-bold rounded-lg border-2 border-slate-700 hover:bg-blue-900 hover:text-white hover:border-blue-500 transition transform hover:scale-105";
            }
            
            if (dadosGlobais) renderizarTabela();
        }

        async function carregarDashboard() {
            try {
                const resposta = await fetch('https://sartisfacao-api.onrender.com/api/dashboard');
                if (!resposta.ok) throw new Error("Falha na ligação à API.");
                
                dadosGlobais = await resposta.json();
                
                document.getElementById('loading').style.display = 'none';
                document.getElementById('container-tabela').classList.remove('hidden');
                
                renderizarTabela();
            } catch (erro) {
                document.getElementById('loading').innerHTML = `<span class="text-red-500 font-bold flex items-center justify-center p-4">❌ Erro de Ligação: ${erro.message}</span>`;
            }
        }

        function criarBarraProgresso(percentagem, tipo) {
            let corBarra = percentagem == 100 ? 'bg-green-500' : (percentagem > 0 ? (tipo === 'cartas' ? 'bg-purple-500' : 'bg-blue-500') : 'bg-slate-600');
            let corTexto = percentagem == 100 ? 'text-green-400' : (percentagem > 0 ? 'text-white' : 'text-slate-500');
            
            return `
                <div class="flex flex-col items-center justify-center w-full min-w-[100px]">
                    <div class="text-sm font-bold ${corTexto} mb-1">${percentagem}%</div>
                    <div class="w-full bg-slate-900 rounded-full h-2 mb-1 shadow-inner border border-slate-700 overflow-hidden">
                        <div class="${corBarra} h-2 rounded-full transition-all duration-1000" style="width: ${percentagem}%"></div>
                    </div>
                </div>
            `;
        }

        function renderizarTabela() {
            const thead = document.getElementById('tabela-head');
            const tbody = document.getElementById('tabela-body');
            
            thead.innerHTML = '';
            tbody.innerHTML = '';

            const colecoesFiltradas = dadosGlobais.colecoes.filter(c => {
                const eOnePiece = c.nome.startsWith('One Piece: ');
                return tcgAtual === 'pokemon' ? !eOnePiece : eOnePiece;
            });

            let idiomasAtivosNestaAba = new Set();
            colecoesFiltradas.forEach(set => {
                Object.keys(set.idiomas).forEach(idioma => {
                    if (set.idiomas[idioma].cards > 0) {
                        idiomasAtivosNestaAba.add(idioma);
                    }
                });
            });
            let idiomasParaMostrar = Array.from(idiomasAtivosNestaAba).sort();
            
            if (idiomasParaMostrar.length === 0) idiomasParaMostrar = ['English'];

            let headerHTML = '<tr><th class="p-5 bg-slate-950 sticky left-0 z-50 shadow-[2px_0_5px_-2px_rgba(0,0,0,0.8)] border-r border-slate-700 text-yellow-400">Coleções</th>';
            
            idiomasParaMostrar.forEach(idioma => {
                headerHTML += `<th class="p-4 text-center border-l border-slate-700 bg-slate-900 z-40" colspan="2">${idioma}</th>`;
            });
            headerHTML += '</tr><tr class="text-[10px] text-slate-400"><th class="bg-slate-950 sticky left-0 z-50 shadow-[2px_0_5px_-2px_rgba(0,0,0,0.8)] border-r border-slate-700"></th>';
            
            idiomasParaMostrar.forEach(() => {
                headerHTML += `<th class="p-2 border-l border-slate-700 text-center bg-slate-800 z-40">Cartas Salvas</th><th class="p-2 border-l border-slate-700 text-center bg-slate-800 z-40">Imagens</th>`;
            });
            headerHTML += '</tr>';
            thead.innerHTML = headerHTML;

            if (colecoesFiltradas.length === 0) {
                tbody.innerHTML = `<tr><td colspan="100" class="p-10 text-center text-slate-500 text-lg">Nenhuma coleção encontrada.</td></tr>`;
                return;
            }

            colecoesFiltradas.forEach(set => {
                const nomeExibicao = set.nome.replace('One Piece: ', '');
                
                let rowHTML = `<tr class="hover:bg-slate-700/50 transition group">
                    <td class="p-5 bg-slate-800 sticky left-0 z-10 shadow-[2px_0_5px_-2px_rgba(0,0,0,0.8)] group-hover:bg-slate-700 border-r border-slate-700">
                        <div class="font-bold text-white text-base truncate max-w-[250px]" title="${nomeExibicao}">${nomeExibicao}</div>
                        <div class="text-xs text-slate-400 mt-1"><span class="text-yellow-500 font-mono">${set.totalOficial}</span> cartas oficiais</div>
                    </td>`;
                
                idiomasParaMostrar.forEach(idioma => {
                    const stats = set.idiomas[idioma] || { cards: 0, images: 0 };
                    
                    const percCards = set.totalOficial > 0 ? ((stats.cards / set.totalOficial) * 100).toFixed(2) : 0;
                    const limiteImagens = stats.cards > 0 ? stats.cards : 1; 
                    const percImages = stats.cards > 0 ? ((stats.images / limiteImagens) * 100).toFixed(2) : 0;
                    
                    rowHTML += `
                        <td class="p-4 border-l border-slate-700 text-center align-middle">
                            ${criarBarraProgresso(percCards, 'cartas')}
                            <div class="font-normal text-slate-400 text-[11px] mt-1">(${stats.cards} / ${set.totalOficial})</div>
                        </td>
                        <td class="p-4 border-l border-slate-700 text-center align-middle">
                            ${criarBarraProgresso(percImages, 'imagens')}
                            <div class="font-normal text-slate-400 text-[11px] mt-1">(${stats.images} / ${stats.cards})</div>
                        </td>
                    `;
                });
                rowHTML += '</tr>';
                tbody.insertAdjacentHTML('beforeend', rowHTML);
            });
        }

        carregarDashboard();
    </script>
</body>
</html>
